<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080b1d" />
    <title>Starfall — a small multiplayer planet</title>
    <meta name="description" content="Run around a tiny planet with friends and catch the stars that fall on it. No sign-up, on phones and laptops." />
    <link rel="canonical" href="https://cashel.dev/starfall/" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Starfall" />
    <meta property="og:description" content="Run around a tiny planet with friends and catch the stars that fall on it." />
    <meta property="og:url" content="https://cashel.dev/starfall/" />
    <meta property="og:image" content="https://cashel.dev/StarfallDemo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c" aria-label="A small planet at dusk"></canvas>
    <div id="scrim"></div>
    <div id="tags" aria-hidden="true"></div>

    <header id="hud" hidden>
      <div class="corner">
        <a class="mark" href="/" aria-label="Back to cashel.dev">cf<span>.</span></a>
        <button id="leave" type="button" aria-label="Leave this world">Leave</button>
      </div>
      <div id="timer" role="timer" aria-live="off">1:00</div>
      <nav>
        <button id="invite" type="button">Invite</button>
        <button id="sound" type="button" aria-pressed="false">Sound</button>
      </nav>
    </header>
    <ol id="scores" hidden aria-label="Scores"></ol>

    <button id="call" type="button" hidden aria-label="Call out"><i></i></button>
    <div id="toast" role="status" aria-live="polite"></div>

    <section id="start" class="panel" aria-labelledby="start-title">
      <p class="eyebrow">A small multiplayer planet</p>
      <h1 id="start-title">Starfall</h1>
      <label class="field">
        <span>Name</span>
        <input id="name" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" />
      </label>
      <div class="field">
        <span id="figure-label">Figure</span>
        <div class="chooser" role="group" aria-labelledby="figure-label">
          <canvas id="figure" aria-hidden="true"></canvas>
          <div class="who">
            <strong id="figure-name" aria-live="polite"></strong>
            <small id="figure-note"></small>
          </div>
          <button id="figure-prev" type="button" aria-label="Previous figure">&lsaquo;</button>
          <button id="figure-next" type="button" aria-label="Next figure">&rsaquo;</button>
        </div>
      </div>
      <div class="field">
        <span id="colour-label">Colour</span>
        <div id="swatches" role="radiogroup" aria-labelledby="colour-label"></div>
      </div>
      <div class="actions">
        <button id="play" class="solid" type="button">Play</button>
        <button id="friends" class="line" type="button">Private world</button>
      </div>
      <p class="note" id="hint" hidden></p>
    </section>

    <section id="results" class="sheet" hidden aria-live="polite">
      <p class="eyebrow" id="results-next"></p>
      <h2 id="results-title"></h2>
      <ol id="results-list"></ol>
    </section>

    <section id="status" class="sheet" hidden aria-live="polite">
      <h2 id="status-title"></h2>
      <p id="status-text" class="lede"></p>
      <div class="actions">
        <button id="status-action" class="solid" type="button"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
